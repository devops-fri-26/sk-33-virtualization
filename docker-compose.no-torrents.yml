# Varsis without torrents: no Prowlarr, FlareSolverr, VPN or qBittorrent.
# The app hides torrent search/downloads when they're unreachable; uploads still work.
#   docker compose -f docker-compose.no-torrents.yml up --build
# Shares the database/music/covers volumes with the full docker-compose.yml.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: varsis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-varsis}
      POSTGRES_DB: varsis
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U varsis"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    env_file: .env
    environment:
      PROWLARR_API_KEY: "" # torrent search off, even if .env has a key
    depends_on:
      db: { condition: service_healthy }
    volumes:
      - music:/music
      - covers:/covers
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s

  frontend:
    build: ./frontend
    ports: ["8080:80"]
    depends_on: [backend]

  mailpit:
    image: axllent/mailpit
    ports: ["127.0.0.1:8025:8025", "127.0.0.1:1025:1025"]

volumes:
  pgdata:
  music:
  covers:
