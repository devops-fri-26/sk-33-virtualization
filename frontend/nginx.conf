server {
  listen 80;
  root /usr/share/nginx/html;
  server_tokens off;

  # Small by default: the backend reads a JSON body into memory before it knows who sent it. Only uploads are big.
  client_max_body_size 1m;

  # Don't let browsers guess file types (an uploaded "song" must never run as a web page), don't allow the app
  # inside a frame on another site, and keep the tokens of email links out of the Referer header.
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy same-origin always;

  # Behind the Caddy container (docker-compose.https.yml), $remote_addr is Caddy, so every visitor would share one
  # login rate limit. Take the real address from Caddy's header, and only from Docker's own networks: a visitor
  # who connects directly can't fake their address with it.
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 192.168.0.0/16;
  real_ip_header X-Forwarded-For;

  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr; # used by the backend's rate limits
  proxy_buffering off;
  proxy_read_timeout 200s; # some requests take minutes (big imports, searches a plugin sends to other services)

  location = /api/upload {
    client_max_body_size 2g;
    # Pass the upload straight on instead of saving it in nginx first: the backend can refuse it (not logged in,
    # storage full) before 2 GB have been received and written to disk.
    proxy_request_buffering off;
    proxy_http_version 1.1;
    proxy_pass http://backend:8000;
  }
  location /api/ {
    proxy_pass http://backend:8000;
  }
  location / { try_files $uri /index.html; }
}
