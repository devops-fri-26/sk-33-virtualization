server {
  listen 80;
  root /usr/share/nginx/html;
  client_max_body_size 2g;

  location /api/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_buffering off;
    proxy_read_timeout 200s; # torrent searches can take minutes
  }
  location / { try_files $uri /index.html; }
}
