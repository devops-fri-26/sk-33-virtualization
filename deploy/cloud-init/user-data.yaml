#cloud-config
# Varsis on one Ubuntu 24.04 VM, without Docker: Caddy (HTTPS) -> FastAPI backend (systemd) -> PostgreSQL.
# The Vue frontend is built once at boot and served by Caddy as static files.
#
# Settings: edit /etc/varsis/deploy.env below before launching. Everything else is automatic.
# Progress on the VM: tail -f /var/log/cloud-init-output.log
#
# Order of cloud-init stages that matters here (see README.md):
#   init:   write_files -> users/groups      (so no file here may be owned by the varsis user)
#   config: apt sources (deadsnakes PPA), runcmd is only *saved* as a script
#   final:  packages -> scripts_user (runs the runcmd script)
# so runcmd sees every package installed and every file written.
#
# runcmd clones the repository and runs the setup scripts from it (deploy/cloud-init/scripts/), one per step,
# like the Vagrant version. The config files they install are in deploy/cloud-init/files/.

package_update: true
package_upgrade: false # faster first boot; unattended-upgrades installs security fixes (see write_files)

apt:
  sources:
    deadsnakes:
      source: ppa:deadsnakes/ppa # Python 3.13: the backend needs >= 3.13, Ubuntu 24.04 ships 3.12

packages:
  - git
  - curl
  - gpg
  - ufw
  - postgresql
  - python3.13
  - python3.13-venv
  - pipx
  - unattended-upgrades # usually already in the image; listed so the automatic security updates are certain

users:
  - default
  - name: varsis
    system: true
    shell: /usr/sbin/nologin
    homedir: /var/lib/varsis
    no_create_home: true

write_files:
  # --- The only part you normally edit -------------------------------------------------------------
  - path: /etc/varsis/deploy.env
    permissions: "0600"
    content: |
      # Public host name for HTTPS (Let's Encrypt). Its DNS A record must point at this VM and ports 80/443 must
      # be reachable from the internet. Leave empty for a local VM: Caddy then uses the VM's IP address and a
      # certificate from its own local CA (browser warning).
      DOMAIN=devops-sk-33.lrk.si
      # Local VM reached through port forwarding only: the address the browser opens, host[:port],
      # e.g. localhost:8443. Empty: DOMAIN, or else the VM's own IP. Ignored when DOMAIN is set.
      SITE=
      # Git repository and branch to deploy. The setup scripts come from it too, so it must be reachable
      # without a login (public).
      REPO_URL=https://github.com/grobolsek/varsis-app.git
      REPO_REF=main
      # Comma-separated; these accounts become admins.
      ADMIN_EMAILS=
      DEFAULT_QUOTA_GB=10
      # Real SMTP for sign-up / password mails (port 587 with SMTP_TLS=true, or 465). Empty = mails aren't sent.
      SMTP_HOST=
      SMTP_PORT=587
      SMTP_USER=
      SMTP_PASS=
      SMTP_FROM=varsis@localhost
      SMTP_TLS=true
      # Testing only: true installs Mailpit on the VM and sends every mail there instead (the SMTP_* values above
      # except SMTP_FROM are then ignored). Inbox: https://<site>/mailpit/, user "mailpit", password in
      # /etc/varsis/secrets.env (MAILPIT_PASSWORD).
      MAILPIT=false

  # Automatic updates: on every day, and not only from Ubuntu's own security updates (unattended-upgrades' default)
  # but also from Caddy's repository (it faces the internet) and the deadsnakes PPA (Python 3.13). Node.js is left
  # out: it only builds the frontend, nothing runs it. Own file, read after the package's 20auto-upgrades.
  - path: /etc/apt/apt.conf.d/51varsis-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
      Unattended-Upgrade::Origins-Pattern {
              "site=dl.cloudsmith.io";
              "site=ppa.launchpadcontent.net";
      };

# runcmd is saved as one shell script and run at the end of boot. set -e: stop at the first step that fails, so
# cloud-init reports an error. Run it again later (e.g. after git pull): sudo sh /var/lib/cloud/instance/scripts/runcmd
runcmd:
  - set -e
  # REPO_URL, REPO_REF
  - . /etc/varsis/deploy.env
  # Get the code (and the setup scripts); skipped if it's already there
  - '[ -d /opt/varsis/.git ] || git clone --depth 1 --branch "$REPO_REF" "$REPO_URL" /opt/varsis'
  - cd /opt/varsis/deploy/cloud-init/scripts

  # apt repositories for Caddy and Node.js, then those two packages
  - bash install-dependencies.sh

  # ufw: 22, 80, 443
  - bash firewall.sh

  # Database password and SECRET_KEY, generated once on the VM
  - bash secrets.sh

  # Mailpit (only with MAILPIT=true)
  - bash setup-mailpit.sh

  # PostgreSQL role and database
  - bash setup-postgresql.sh

  # Python packages from uv.lock, /etc/varsis/backend.env, backend service
  - bash setup-backend.sh

  # Build the Vue app into /var/www/varsis
  - bash build-frontend.sh

  # Caddyfile from the template, HTTPS certificate
  - bash start-caddy.sh

  # Wait until the backend answers, then check that Caddy serves the site
  - bash health-check.sh

final_message: "Varsis cloud-init finished after $UPTIME s. Details: /var/log/cloud-init-output.log"
