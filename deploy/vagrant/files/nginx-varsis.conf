# Varsis behind nginx: HTTPS, the built frontend, and the backend and Mailpit as reverse proxies.
# Reached from the host through Vagrant's forwarded port: https://localhost:8443 -> this server on 443.
server {
  listen 443 ssl http2;
  server_name localhost;

  # Self-signed certificate from Ubuntu's ssl-cert package (browser warning). Development only.
  ssl_certificate     /etc/ssl/certs/ssl-cert-snakeoil.pem;
  ssl_certificate_key /etc/ssl/private/ssl-cert-snakeoil.key;
  ssl_protocols TLSv1.2 TLSv1.3;

  root /var/www/varsis;
  server_tokens off; # don't show the nginx version

  access_log /var/log/nginx/varsis-access.log;
  error_log  /var/log/nginx/varsis-error.log;

  # Small by default: the backend reads a JSON body into memory before it knows who sent it. Only uploads are big.
  client_max_body_size 1m;

  # Don't let browsers guess file types (an uploaded "song" must never run as a web page), don't allow the app in a
  # frame on another site, and keep the tokens of email links out of the Referer header. No HSTS: it would make the
  # browser insist on https for every app on localhost.
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy same-origin always;

  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr; # the backend's rate limits key on it
  proxy_buffering off;
  proxy_read_timeout 200s; # big imports can take minutes

  location = /api/upload {
    client_max_body_size 2g;
    # Stream the upload to the backend instead of saving it first: the backend can refuse it (not logged in, storage
    # full) before 2 GB have been received.
    proxy_request_buffering off;
    proxy_http_version 1.1;
    proxy_pass http://127.0.0.1:8000;
  }

  location /api/ {
    proxy_pass http://127.0.0.1:8000;
  }

  # Mailpit's web UI. It shows mails in a frame of its own (same origin), so SAMEORIGIN instead of DENY here. An
  # add_header in a location replaces the server's add_headers, so the other two are repeated.
  location /mailpit/ {
    proxy_pass http://127.0.0.1:8025;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade; # live updates over a WebSocket
    proxy_set_header Connection "upgrade";
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
  }

  # The Vue app handles its own routes (/login, /admin, ...): unknown paths get index.html.
  location / {
    try_files $uri /index.html;
  }
}
